{% extends 'base.html' %}{% from 'components.html' import csrf with context %}
{% block content %}<section class="page-heading"><h1>{{ t('goals.edit' if goal else 'goals.create') }}</h1></section><article class="card form-card"><form method="post" class="form-grid">{{ csrf() }}<label class="full-width">{{ t('goals.name') }}<input name="name" maxlength="80" value="{{ values.get('name',goal.name if goal else '') }}" required></label><label>{{ t('goals.target') }}<input name="target_amount" inputmode="decimal" value="{{ values.get('target_amount','%.2f'|format(goal.target_cents/100) if goal else '') }}" required></label><label>{{ t('goals.current') }}<input name="current_amount" inputmode="decimal" value="{{ values.get('current_amount','%.2f'|format(goal.current_cents/100) if goal else '0') }}" required></label><label>{{ t('currency') }}<select name="currency">{% for currency in currencies %}<option value="{{ currency }}" {{ 'selected' if values.get('currency',goal.currency if goal else settings.currency)==currency }}>{{ currency }}</option>{% endfor %}</select></label><label>{{ t('goals.target_date') }}<input type="date" name="target_date" value="{{ values.get('target_date',goal.target_date.isoformat() if goal and goal.target_date else '') }}"></label><p class="muted full-width">{{ t('goals.independent') }}</p><div class="form-actions full-width"><a class="button" href="{{ url_for('goals.index') }}">{{ t('cancel') }}</a><button class="button primary">{{ t('save') }}</button></div></form></article>{% endblock %}
