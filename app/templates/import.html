{% extends 'base.html' %}{% from 'components.html' import csrf, icon with context %}
{% block content %}<section class="page-heading"><div><h1>{{ t('csv.import') }}</h1><p>{{ t('csv.hint') }}</p></div><a class="button" href="{{ url_for('transfer.index') }}">{{ t('nav.transfer') }}</a></section><article class="card form-card"><form method="post" enctype="multipart/form-data" class="form-grid">{{ csrf() }}<label class="full-width">{{ t('csv.file') }}<input type="file" name="csv" accept=".csv,text/csv" required></label><p class="muted full-width">{{ t('csv.format') }}</p><code class="full-width">Date,Type,Category,Description,Amount</code><button class="button primary full-width">{{ t('csv.preview') }}</button></form></article>{% endblock %}
