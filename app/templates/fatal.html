<!doctype html>
<html lang="{{ language }}" data-theme="{{ theme }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ code }} · {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='css/v2.css') }}"></head>
<body><main class="standalone-error"><section class="card empty-state" role="alert">
<div class="error-code">{{ code }}</div><h1>{{ t('error_title') }}</h1>
<p>{{ t(message) }}</p><p>{{ t('error.recovery') }}</p>
<a class="button primary" href="{{ url_for('dashboard.index') }}">{{ t('back_home') }}</a>
</section></main></body></html>
