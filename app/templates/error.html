{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="empty-state error-page">
<div class="error-code">{{ code }}</div>
<h1>{{ t('error_title') }}</h1>
<p>{{ t(message) }}</p>
<a href="{{ url_for('dashboard.index') }}" class="button primary">{{ t('back_home') }}</a>
</section>
{% endblock %}
