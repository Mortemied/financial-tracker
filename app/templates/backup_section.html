<section class="card backup-section"><div class="card-heading"><h2>{{ t('backup.title') }}</h2></div><div class="backup-body"><p class="muted">{{ t('backup.hint') }}</p><div class="form-actions"><form method="post" action="{{ url_for('backups.create') }}">{{ csrf() }}<button class="button primary">{{ t('backup.create') }}</button></form><form method="post" action="{{ url_for('backups.open_folder') }}">{{ csrf() }}<button class="button">{{ t('backup.open') }}</button></form></div><form method="post" action="{{ url_for('backups.preview') }}" enctype="multipart/form-data" class="stack-form">{{ csrf() }}<label>{{ t('backup.restore') }}<input type="file" name="backup" accept=".db,.sqlite,.sqlite3" required></label><button class="button">{{ t('backup.preview') }}</button></form></div></section>
{% if config.get('STOP_APPLICATION') %}<form method="post" action="{{ url_for('backups.quit_app') }}" class="quit-form">{{ csrf() }}<button class="button">{{ t('app.quit') }}</button></form>{% endif %}
